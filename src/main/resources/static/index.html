<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <style>
        h1 {
            margin-bottom: 20px;
        }
        
        .container {
            width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .card {
            background-color: #dddddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 800px;
            margin: 0 auto 30px auto;
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: #444;
        }
        
        label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        
        .mb-2 {
            margin-bottom: 12px;
        }
        
        .container-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        table {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        td, th {
            vertical-align: middle;
            padding: 10px 15px;
        }
    </style>

    <div class="container">
        <h1>Gerenciador de Usuarios</h1>
    </div>
    <div class="card">
        <h3 id="formTitulo">Novo Usuario</h3>  
        <input type="hidden" id="userId">       
        <div class="mb-2">
            <label>Nome</label>
            <input type="text" id="inputNome">
        </div>
        <div class="mb-2">
            <label>Email</label>
            <input type="text" id="inputEmail">
        </div>
        <button class="btn btn-primary" onclick="salvar()">Criar</button>
    </div>
    <div class="container-content">
        <table class="table table-bordered mt-4">
            <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const URL = '/usuarios';

        // Carregar usuários ao abrir a página
        async function carregar() {
            const res = await fetch(URL);
            const usuarios = await res.json();

            const tabela = document.getElementById('tabela');
            tabela.innerHTML = '';

            usuarios.forEach(u => {
                tabela.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editar(${u.id}, '${u.nome}', '${u.email}')">Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="excluir(${u.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function salvar() {
            const id = document.getElementById('userId').value;
            const nome = document.getElementById('inputNome').value;
            const email = document.getElementById('inputEmail').value;

            if (id) {
                await fetch(`${URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, nome, email })
                });
            } else {
                await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email })
                });
            }

            limparForm();
            carregar();
        }

        function editar(id, nome, email) {
            document.getElementById('formTitulo').textContent = 'Editar Usuário';
            document.getElementById('userId').value = id;
            document.getElementById('inputNome').value = nome;
            document.getElementById('inputEmail').value = email;
        }

        async function excluir(id) {
            if (confirm('Deseja excluir este usuário?')) {
                await fetch(`${URL}/${id}`, { method: 'DELETE' });
                carregar();
            }
        }

        // Limpar formulário
        function limparForm() {
            document.getElementById('formTitulo').textContent = 'Novo Usuário';
            document.getElementById('userId').value = '';
            document.getElementById('inputNome').value = '';
            document.getElementById('inputEmail').value = '';
        }

        carregar();
    </script>
</body>
</html>
