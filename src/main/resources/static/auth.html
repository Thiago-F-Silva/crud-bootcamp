<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Autenticação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .card {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        label {
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 class="mb-4">Autenticação</h3>
        <div class="mb-3">
            <label>Nome</label>
            <input type="text" id="authNome" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="text" id="authEmail" class="form-control">
        </div>
        <button class="btn btn-danger w-100" onclick="autenticar()">Confirmar exclusão</button>
        <button class="btn btn-secondary w-100 mt-2" onclick="voltar()">Cancelar</button>
    </div>

    <script>
        const API_URL = '/usuarios';

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function autenticar() {
            const nome = document.getElementById('authNome').value;
            const email = document.getElementById('authEmail').value;

            if (!nome || !email) {
                alert('Preencha todos os campos');
                return;
            }

            const res = await fetch(`${API_URL}/autenticar?nome=${nome}&email=${email}`);

            if (res.ok) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                window.location.href = '/index.html'; // volta para a tela anterior
            } else {
                alert('Autenticação falhou! Apenas administradores podem excluir.');
            }
        }

        function voltar() {
            window.location.href = '/index.html';
        }
    </script>

</body>
</html>
